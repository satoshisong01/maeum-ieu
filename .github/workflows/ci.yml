# 마음이음 CI — 안전성 자동 검증
#
# 트리거:
#   - push: main 브랜치 직접 push 시
#   - pull_request: 모든 PR에 대해 자동 실행
#
# 검사 항목 (모두 fail 시 머지/배포 막힘):
#   1. TypeScript 컴파일 (타입 안전성)
#   2. User-scope audit (모든 user-scoped 쿼리에 user_id 필터 있는지)
#   3. Prompt-leak detector (regex-only 모드) — DB 접근 불필요. 한국어 이름이
#      "큰아들 X" 같은 패턴으로 prompt 파일에 박혔는지 검출
#
# 보안: DB 접근 필요한 full prompt-leak 검사는 별도 schedule workflow에서 실행 (cron).

name: CI Safety Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'   # 로컬·Docker 베이스와 동일하게 고정(2026-10-02) — 버전이 갈리면 CI 녹색이 배포 안전을 보증하지 못한다
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit
        continue-on-error: false

      # 에러 0(2026-10-02 79건 정리) + **경고 래칫**. 경고를 "추적한다"고 적어두기만 했더니
      #   215 → 217 → 220으로 조용히 늘었다(2026-10-06 실측). 숫자는 내리기만 한다.
      #   docs/검증_가이드.md §6의 수치와 같아야 한다(__tests__/docs-consistency.test.ts가 검사).
      # --report-unused-disable-directives: 쓰이지 않는 예외 지시문도 에러로 — 낡은 예외는 나중에
      #   진짜 문제를 조용히 삼킨다(2026-10-06: useWakeWord의 react-hooks/refs가 그 상태였다).
      - name: Lint (에러 0 + 경고 래칫 + 낡은 예외 금지)
        run: npx eslint . --max-warnings 216 --report-unused-disable-directives
        continue-on-error: false

      # vitest가 safety-regression(342) + regex-battery를 함께 돈다
      #   (__tests__/gate-scripts.test.ts로 편입 — 별도 명령은 잊히고, 커버리지에도 안 잡혔다)
      # 커버리지 임계치는 vitest.config.ts의 래칫 — 안전 핵심 9개 파일의 분기가 내려가면 fail.
      - name: Unit tests + 게이트 스크립트 + 커버리지 래칫
        run: npx vitest run --coverage
        continue-on-error: false  # 회귀 고정 + 커버리지 하락 차단 — 깨지면 merge 금지

      # 2026-10-02까지 warning 모드였다 — 오탐 8건이 상시 레드를 만들었고, 상시 레드인
      #   게이트는 아무도 보지 않게 되어 진짜 위반이 섞여도 구분되지 않았다.
      #   탐지기를 고치고(주석 스킵·컨텍스트 25줄) 남은 오탐은 ACKNOWLEDGED에 근거와 함께
      #   기록해 0건으로 만든 뒤 strict로 올렸다. 새 위반만 레드가 된다.
      - name: User-scope audit (DB queries have user_id filter)
        run: npx tsx scripts/audit-user-scope.ts
        continue-on-error: false

      # ⚠ CI가 빌드를 한 번도 하지 않고 있었다 — 유일한 빌드 검증이 Vercel이었는데
      #   AWS 이전으로 그걸 끊는 중이다(2026-10-02 감사 #37).
      #   standalone 경로로 빌드해야 Docker에서 쓸 산출물과 같은 코드를 검증한다.
      - name: Production build (standalone — Docker가 쓰는 경로)
        run: npm run build
        env:
          BUILD_STANDALONE: "1"
        continue-on-error: false

      - name: Prompt-leak detector (regex-only)
        run: npx tsx scripts/check-prompt-leak.ts --regex-only
        continue-on-error: false  # 사용자 이름이 prompt에 박히면 즉시 fail

      - name: Summary
        if: always()
        run: |
          echo "## CI Safety Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript compile: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint (eslint, 에러 0): strict" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests + safety-regression 342 + regex-battery + 커버리지 래칫: strict" >> $GITHUB_STEP_SUMMARY
          echo "- User-scope audit: strict (오탐은 ACKNOWLEDGED에 근거 기록)" >> $GITHUB_STEP_SUMMARY
          echo "- Production build (standalone): strict" >> $GITHUB_STEP_SUMMARY
          echo "- Prompt-leak (regex): strict" >> $GITHUB_STEP_SUMMARY
