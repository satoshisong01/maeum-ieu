# Prompt-leak Full 검사 — DB의 실제 사용자 데이터와 cross-check.
#
# regex-only 모드와 달리 DB 접근 필요. 운영 DB의 family_member/user_profile에서
# 실제 사용자 이름을 가져와 prompt 파일에 박혀있는지 정확 검출.
#
# 트리거:
#   - workflow_dispatch: 운영자가 GitHub UI에서 수동 실행
#   - schedule: 매일 한국 시각 새벽 3시 (UTC 18:00) 자동 실행
#
# 보안: DATABASE_URL은 GitHub Secrets에 저장. CI 환경에서만 접근. 결과 로그에는
#       사용자 이름이 노출될 수 있으므로 PR review에서는 사용 X (private 저장소 권장).

name: Prompt-leak Full Check (DB-backed)

on:
  workflow_dispatch:  # 수동 실행 가능
  schedule:
    - cron: '0 18 * * *'  # 매일 UTC 18:00 = KST 03:00

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prompt-leak full (DB cross-check)
        run: npx tsx scripts/check-prompt-leak.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Prompt-leak detected! User-specific data may be embedded in prompts."
          echo "Run locally: npx tsx scripts/check-prompt-leak.ts"
